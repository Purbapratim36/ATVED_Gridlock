[project]
name = "atved"
version = "0.1.0"
description = "Automated Traffic Violation Evidence & Detection Platform"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "ATVED Team" }]

dependencies = [
    # === API ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7.4",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.15.0",

    # === Message Broker ===
    "aiokafka>=0.11.0",
    "confluent-kafka>=2.6.0",

    # === Cache ===
    "redis[hiredis]>=5.2.0",

    # === Object Storage ===
    "boto3>=1.35.0",
    "aiobotocore>=2.15.0",

    # === Image Processing ===
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",

    # === Configuration ===
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",

    # === Observability ===
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",

    # === Crypto ===
    "cryptography>=43.0.0",

    # === Utilities ===
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.3.0",
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
    "onnxruntime-gpu>=1.19.0",
    "supervision>=0.24.0",
    "lap>=0.5.0",
]

mlops = [
    "mlflow>=2.17.0",
    "evidently>=0.4.0",
    "wandb>=0.18.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "ipython>=8.28.0",
]

edge = [
    "tensorrt>=10.5.0",
]

[project.scripts]
atved = "atved.cli:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "S104"]

[tool.ruff.lint.isort]
known-first-party = ["atved"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "gpu: marks tests requiring GPU",
    "fairness: marks bias/fairness tests",
]

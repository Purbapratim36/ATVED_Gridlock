<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATVED Control Room</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="blob purple" style="top: 0; left: -100px;"></div>

    <nav>
        <div class="logo">ATVED Authority</div>
        <div class="nav-links">
        </div>
    </nav>

    <div class="container fade-in" style="max-width: 1400px; margin-top: 30px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 style="font-size: 32px; margin-bottom: 5px; display: flex; align-items: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 12px;"><path d="M12 2L2 22h20L12 2z"></path><path d="M12 9v4"></path><circle cx="12" cy="17" r="1"></circle></svg> Live Control Room</h1>
                <p style="color: var(--text-muted);">Real-time monitoring, analytics, and network health.</p>
            </div>
            <span class="tag" style="background: rgba(0, 240, 255, 0.2); color: var(--accent-primary); border: 1px solid var(--accent-primary);">Live Connection Active</span>
        </div>

        <!-- KPIs -->
        <div class="grid-4" style="margin-bottom: 30px;">
            <div class="glass-panel metric-card">
                <h3>Fines Issued</h3>
                <h1 id="statFines">--</h1>
            </div>
            <div class="glass-panel metric-card">
                <h3>Revenue Generated</h3>
                <h1 id="statRevenue" style="background: linear-gradient(90deg, #fff, var(--success)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">₹--</h1>
            </div>
            <div class="glass-panel metric-card">
                <h3>Pending Collection</h3>
                <h1 id="statPending" style="background: linear-gradient(90deg, #fff, var(--warning)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">₹--</h1>
            </div>
            <div class="glass-panel metric-card">
                <h3>Registered Drivers</h3>
                <h1 id="statDrivers">--</h1>
            </div>
        </div>

        <div class="grid-2">
            <!-- Chart -->
            <div class="glass-panel" style="display: flex; flex-direction: column; justify-content: center;">
                <h3 style="margin-bottom: 15px; display: flex; align-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 10px;"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg> Violations by Day</h3>
                <div style="height: 450px; position: relative;">
                    <canvas id="violationsChart"></canvas>
                </div>
            </div>

            <!-- Feed -->
            <div class="glass-panel" style="overflow-y: auto; height: 535px;">
                <h3 style="margin-bottom: 15px; display: flex; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 10px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg> Recent Violations</h3>
                <table id="violationsTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Driver</th>
                            <th>Score</th>
                            <th>Violation</th>
                            <th>E-Challan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/authority.js?v=2"></script>
</body>
</html>

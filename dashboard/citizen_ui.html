<!DOCTYPE html>
<html lang="en" class="bg-[#0B0C10] text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATVED - Citizen Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { bg: '#0B0C10', panel: '#141823', glassBorder: 'rgba(255, 255, 255, 0.1)' },
                        tier: { critical: '#FF1744', fair: '#FF9100', good: '#FFEA00', excellent: '#00E676' },
                        accent: { cyan: '#00F2FE' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Roboto Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0B0C10 0%, #0F1015 100%); min-height: 100vh; }
        .glass-panel { background: rgba(20, 24, 35, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="text-slate-200 selection:bg-accent-cyan selection:text-black">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const getTierDetails = (score) => {
            if (score >= 900) return { name: "EXCELLENT", color: "#00E676", discount: 0.10, label: "10% VIP Relaxation Active" };
            if (score >= 750) return { name: "GOOD", color: "#FFEA00", discount: 0.05, label: "5% Standard Relaxation Active" };
            if (score >= 500) return { name: "FAIR", color: "#FF9100", discount: 0.02, label: "2% Minimal Relaxation Active" };
            return { name: "POOR", color: "#FF1744", discount: 0, label: "0% Relaxation - Penalty Multiplier Risk" };
        };

        const initialData = {
            driver: { name: "Purba Pratim Mahanta", balance: 61000, score: 420 },
            challans: [
                { id: "ATVED_2026_8X9K2A", date: "6/21/2026 01:26 PM", type: "HELMET", baseFine: 1000, status: "UNPAID" },
                { id: "ATVED_2026_1A3B4C", date: "6/18/2026 04:15 PM", type: "SPEEDING", baseFine: 2000, status: "UNPAID" },
                { id: "ATVED_2026_9Z8Y7X", date: "5/12/2026 10:00 AM", type: "STOP_LINE", baseFine: 500, status: "PAID", paidAmount: 500 }
            ]
        };

        const CitizenApp = () => {
            const [data, setData] = useState(() => {
                const stored = localStorage.getItem('atved_sync_data');
                return stored ? JSON.parse(stored) : initialData;
            });

            useEffect(() => {
                localStorage.setItem('atved_sync_data', JSON.stringify(data));
                
                const handleStorage = (e) => {
                    if (e.key === 'atved_sync_data' && e.newValue) {
                        setData(JSON.parse(e.newValue));
                    }
                };
                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, [data]);

            const tier = getTierDetails(data.driver.score);

            const handlePay = (id, amountDue) => {
                setData(prev => ({
                    ...prev,
                    driver: { ...prev.driver, balance: prev.driver.balance - amountDue, score: Math.min(1000, prev.driver.score + 150) },
                    challans: prev.challans.map(c => c.id === id ? { ...c, status: "PAID", paidAmount: amountDue } : c)
                }));
            };

            return (
                <div className="flex flex-col min-h-screen relative overflow-hidden">
                    <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full mix-blend-screen filter blur-[150px] opacity-10 pointer-events-none transition-colors duration-1000" style={{ backgroundColor: tier.color }}></div>
                    <header className="flex justify-between items-center px-8 py-5 border-b border-brand-glassBorder glass-panel sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded bg-gradient-to-br from-accent-cyan to-blue-800 flex items-center justify-center shadow-[0_0_15px_rgba(0,242,254,0.4)]"><span className="font-bold text-black text-sm">A</span></div>
                            <h1 className="text-xl font-bold tracking-wider text-white">ATVED GridLock <span className="text-accent-cyan text-sm font-normal ml-2">Citizen Portal</span></h1>
                        </div>
                        <nav className="flex items-center gap-8 text-sm font-medium">
                            <button className="pb-1 border-b-2 border-accent-cyan text-white text-shadow-sm">Citizen Portal</button>
                            <a href="authority_ui.html" className="pb-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">Control Room</a>
                        </nav>
                    </header>

                    <main className="flex-1 p-8 max-w-7xl w-full mx-auto z-10 relative flex flex-col gap-6 animate-in fade-in duration-500">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center relative overflow-hidden">
                                <h2 className="text-slate-400 font-medium text-sm tracking-widest uppercase mb-6 w-full text-left">Dynamic Traffic Score</h2>
                                <div className="relative w-48 h-48 flex flex-col items-center justify-center rounded-full border-[6px] transition-all duration-1000 ease-in-out mb-4" style={{ borderColor: tier.color, boxShadow: `0 0 40px ${tier.color}33`, borderTopColor: 'transparent' }}>
                                    <span className="font-mono text-6xl font-bold transition-colors duration-1000" style={{ color: tier.color, textShadow: `0 0 20px ${tier.color}80` }}>{data.driver.score}</span>
                                    <div className="mt-2 text-[11px] font-bold px-4 py-1 rounded-full border transition-all duration-1000 tracking-wider" style={{ color: tier.color, borderColor: tier.color, backgroundColor: `${tier.color}15` }}>{tier.name}</div>
                                </div>
                                <p className="text-slate-300 text-sm mt-4 font-medium flex items-center gap-2">Reward: <span className="px-2 py-0.5 rounded text-xs transition-colors duration-1000" style={{ backgroundColor: `${tier.color}20`, color: tier.color, border: `1px solid ${tier.color}50` }}>{tier.label}</span></p>
                            </div>
                            <div className="glass-panel rounded-2xl p-8 flex flex-col justify-between">
                                <div className="mb-8">
                                    <h2 className="text-slate-400 font-medium text-xs tracking-widest uppercase mb-3">Linked Bank Account</h2>
                                    <div className="flex items-center justify-between">
                                        <div><h3 className="text-xl font-bold text-white">HDFC Bank</h3><p className="font-mono text-slate-400 text-sm mt-1">XXXX-XXXX-7823</p></div>
                                        <div className="text-right"><p className="text-xs text-slate-400 mb-1">LIVE BALANCE</p><p className="font-mono text-2xl font-bold text-accent-cyan transition-all duration-500">₹{data.driver.balance.toLocaleString()}</p></div>
                                    </div>
                                </div>
                                <div className="h-px w-full bg-brand-glassBorder mb-8"></div>
                                <div>
                                    <h2 className="text-slate-400 font-medium text-xs tracking-widest uppercase mb-3">Registered Vehicles</h2>
                                    <div className="flex items-center justify-between bg-[#1A1F2E] p-4 rounded-lg border border-brand-glassBorder">
                                        <p className="text-sm font-medium text-white">Royal Enfield Classic 350 <span className="text-slate-500 block text-[11px] mt-1 uppercase tracking-wider">Gunmetal Grey</span></p>
                                        <div className="bg-[#E2E8F0] text-[#0F172A] font-mono font-bold text-sm px-3 py-1.5 rounded shadow-inner border border-slate-400">AS 03 PM 7823</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel rounded-2xl p-8">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-slate-400 font-medium text-sm tracking-widest uppercase">Outstanding & Historical E-Challans</h2>
                            </div>
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="text-xs text-slate-500 uppercase tracking-wider border-b border-brand-glassBorder"><th className="pb-4 font-medium">Date & Time</th><th className="pb-4 font-medium">Violation</th><th className="pb-4 font-medium text-right">Base Fine</th><th className="pb-4 font-medium text-center">Active Discount</th><th className="pb-4 font-medium text-right">Amount Due</th><th className="pb-4 font-medium text-center">Status</th><th className="pb-4 font-medium text-right">Action</th></tr>
                                </thead>
                                <tbody className="text-sm">
                                    {data.challans.map((c) => {
                                        const isUnpaid = c.status === "UNPAID";
                                        const activeDiscountPct = isUnpaid ? tier.discount : 0;
                                        const amountDue = isUnpaid ? c.baseFine - (c.baseFine * activeDiscountPct) : c.paidAmount;
                                        return (
                                            <tr key={c.id} className="border-b border-brand-glassBorder/30 hover:bg-white/5 transition-colors">
                                                <td className="py-4 font-mono text-slate-300 text-xs">{c.date}</td>
                                                <td className="py-4"><span className="bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded text-[10px] font-bold">{c.type}</span></td>
                                                <td className="py-4 font-mono text-slate-400 text-right">₹{c.baseFine}</td>
                                                <td className="py-4 text-center"><span className="font-mono text-xs transition-colors duration-1000" style={{ color: activeDiscountPct > 0 ? tier.color : '#64748B' }}>{isUnpaid ? activeDiscountPct * 100 + '%' : '-'}</span></td>
                                                <td className="py-4 font-mono font-medium text-right transition-colors duration-1000" style={{ color: isUnpaid ? tier.color : '#94A3B8' }}>₹{amountDue}</td>
                                                <td className="py-4 text-center font-bold tracking-wider text-xs">{isUnpaid ? <span className="text-tier-critical">UNPAID</span> : <span className="text-tier-excellent">PAID</span>}</td>
                                                <td className="py-4 text-right">
                                                    {isUnpaid ? <button onClick={() => handlePay(c.id, amountDue)} className="bg-accent-cyan text-black hover:bg-white font-bold text-xs px-5 py-2 rounded-full shadow-[0_0_15px_rgba(0,242,254,0.4)] transition-all">Pay Challan</button> : <button className="border border-slate-600 text-slate-300 text-xs px-4 py-1.5 rounded-full">Download PDF</button>}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CitizenApp />);
    </script>
</body>
</html>
